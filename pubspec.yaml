name: ahtizam
description: "This is A standard project to start all projects from here."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  auto_route: ^9.2.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  dots_indicator: ^4.0.1
  carousel_slider: ^5.0.0
  easy_localization: ^3.0.7
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.3.4
  queen_validators: ^1.0.1
  bcrypt: ^1.1.3
  bot_toast: ^4.1.3
  lottie: ^3.3.1
  webview_flutter: ^4.10.0
  another_stepper: ^1.2.2
  mockito: ^5.4.5
  device_preview: ^1.2.0
  pinput: ^5.0.1
  crystal_navigation_bar: ^1.0.2
  flutter_floating_bottom_bar: ^1.2.1+1
  dot_navigation_bar: ^1.0.2
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.10.1
  geolocator: ^13.0.2
  geocoding: ^2.1.1
  google_geocoding_api: ^1.5.2
  permission_handler: ^11.4.0
  avatar_glow: ^3.0.1
  flutter_polyline_points_plus: ^3.0.0
  flutter_google_places_hoc081098: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.2
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2
  auto_route_generator: ^9.0.0
  flutter_gen_runner: ^5.8.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/fonts/
    - .env
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Medium.ttf
          style: italic
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_gen:
  integrations:
    flutter_svg: true
flutter_intl:
  enabled: true
